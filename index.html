<style>
  html { scroll-behavior: smooth; }

  /* 跳过导航 */
  .skip-link {
    position: absolute;
    top: -100%;
    left: 16px;
    z-index: 200;
    padding: 8px 16px;
    background: #22d3ee;
    color: #000;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    text-decoration: none;
    transition: top .2s ease;
  }
  .skip-link:focus { top: 8px; }

  /* 打字机闪烁光标 */
  .cursor {
    display: inline-block;
    width: 2px;
    margin-left: 2px;
    color: #14b8a6;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* 滚动渐入：由 JS 添加 .reveal 触发，未执行脚本时元素保持可见（降级） */
  .reveal { opacity: 0; transform: translateY(18px); transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), transform 0.6s cubic-bezier(0.22, 1, 0.36, 1); will-change: opacity, transform; }
  .reveal.is-visible { opacity: 1; transform: translateY(0); }

  /* 3D 倾斜卡片 */
  .tilt-card { transform-style: preserve-3d; will-change: transform; }
  .tilt-glare { border-radius: inherit; }

  /* 头像摇摆动画 */
  @keyframes avatar-sway {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }
  .avatar-sway { animation: avatar-sway 2.6s ease-in-out infinite; will-change: transform; position: relative; }

  /* 头像呼吸光环（双层：实心外圈呼吸 + 虚线内轨旋转） */
  .avatar-sway::before,
  .avatar-sway::after {
    content: ''; position: absolute; border-radius: 50%;
    pointer-events: none; left: 0; top: 0; right: 0; bottom: 0;
  }
  .avatar-sway::before {
    inset: -9px; border: 2px solid rgba(34, 211, 238, 0.55);
    box-shadow: 0 0 22px rgba(34, 211, 238, 0.28);
    animation: halo-breathe 2.6s ease-in-out infinite;
  }
  .avatar-sway::after {
    inset: -18px; border: 1px dashed rgba(34, 211, 238, 0.32);
    animation: halo-spin 14s linear infinite;
  }
  @keyframes halo-breathe {
    0%, 100% { opacity: .45; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.06); }
  }
  @keyframes halo-spin { to { transform: rotate(360deg); } }

  /* 首屏闪进动画：进入页面时逐项淡入上移 */
  .hero-anim-item { opacity: 0; transform: translateY(22px); animation: heroFadeIn 0.9s cubic-bezier(0.2, 1, 0.3, 1) forwards; }
  @keyframes heroFadeIn { 0% { opacity: 0; transform: translateY(22px); } 100% { opacity: 1; transform: translateY(0); } }
  .delay-1 { animation-delay: 0.08s; }
  .delay-2 { animation-delay: 0.16s; }
  .delay-3 { animation-delay: 0.24s; }
  .delay-4 { animation-delay: 0.32s; }
  .delay-5 { animation-delay: 0.40s; }
  .delay-6 { animation-delay: 0.48s; }
  .delay-7 { animation-delay: 0.56s; }
  .delay-8 { animation-delay: 0.64s; }

  /* 气泡反馈 */
  .bubble {
    position: fixed;
    z-index: 200;
    padding: 8px 14px;
    background: #18181b;
    color: #fff;
    border: 1px solid #3f3f46;
    font-size: 13px;
    border-radius: 10px;
    white-space: nowrap;
    pointer-events: none;
    transform: translate(-50%, -120%) scale(0.8);
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .bubble::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 100%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: #18181b;
  }
  .bubble.show { opacity: 1; transform: translate(-50%, -130%) scale(1); }

  /* 弹窗 */
  .modal { display: none; }
  .modal.open { display: flex; }

  /* 减弱动效偏好 + 确保降级可见 */
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
    .cursor { animation: none; }
    .tilt-card { transform: none !important; transition: none !important; }
    .avatar-sway { animation: none; }
    .avatar-sway::before, .avatar-sway::after { animation: none; }
    .hero-anim-item { opacity: 1 !important; transform: none !important; animation: none !important; }
  }

  /* ============ 兴趣模块 ============ */
  .interest-tags {

  .interest-covers {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 12px;
    padding: 8px 6px 14px;

  .interest-covers::before {

  }
  .interest-cover {
    position: relative;
    width: 100%;

    background: #0a0a0b;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.08);

                box-shadow 0.35s cubic-bezier(0.22, 1, 0.36, 1),

  }
  .interest-cover:nth-child(1) { transform: rotate(-5deg); }
  .interest-cover:nth-child(2) { transform: rotate(4deg); }
  .interest-cover:nth-child(3) { transform: rotate(3deg); }
  .interest-cover:nth-child(4) { transform: rotate(-4deg); }
  .interest-cover:hover {
    transform: rotate(0deg) scale(1.12) !important;
    z-index: 3;

    filter: brightness(1.08) saturate(1.1);
  }
  .interest-card:hover .interest-cover:not(:hover) {
    filter: brightness(0.78) saturate(0.7);
  }
  .interest-cover:active { cursor: zoom-out; }

  @media (max-width: 640px) {
    .interest-covers { gap: 5px; margin-bottom: 10px; padding: 6px 4px 10px; }
    .interest-cover:hover { transform: rotate(0deg) scale(1.08) !important; }
  }
  html.light .interest-covers::before {
    background: linear-gradient(135deg, rgba(8,145,178,0.06), rgba(5,150,105,0.04));
  }
  html.light .interest-cover {
    border-color: rgba(0,0,0,0.08);

  }
  html.light .interest-cover:hover {

  }
  html.light .interest-card:hover .interest-cover:not(:hover) {
    filter: brightness(0.88) saturate(0.85);
  }
  @media (prefers-reduced-motion: reduce) {

  /* ============ 火把 · 主题切换 ============ */
  .torch-toggle { position: fixed; right: 18px; bottom: 48px; z-index: 70; transform: scale(0.72); transform-origin: bottom right; }

  .torch-box input { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }
  .torch-box { display: flex; flex-direction: column; align-items: center; position: relative; cursor: pointer; user-select: none; }
  .simple-text { position: absolute; bottom: -40px; width: 120px; text-align: center; color: white; font-size: 16pt; font-weight: 800; font-family: monospace; }
  .torch { display: flex; justify-content: center; height: 150px; }
  .head, .stick { position: absolute; width: 30px; transform-style: preserve-3d; transform: rotateX(-30deg) rotateY(45deg); }
  .stick { position: relative; height: 120px; }
  .face { position: absolute; transform-style: preserve-3d; width: 30px; height: 30px; display: grid; grid-template-columns: 50% 50%; grid-template-rows: 50% 50%; background-color: #000000; }
  .top { transform: rotateX(90deg) translateZ(15px); }
  .left { transform: rotateY(-90deg) translateZ(15px); }
  .right { transform: rotateY(0deg) translateZ(15px); }
  .top div, .left div, .right div { width: 102%; height: 102%; }
  .top div:nth-child(1), .left div:nth-child(3), .right div:nth-child(3) { background-color: #ffff9760; }
  .top div:nth-child(2), .left div:nth-child(1), .right div:nth-child(1) { background-color: #ffd80060; }
  .top div:nth-child(3), .left div:nth-child(4), .right div:nth-child(4) { background-color: #ffffff60; }
  .top div:nth-child(4), .left div:nth-child(2), .right div:nth-child(2) { background-color: #ff8f0060; }

  .side { position: absolute; width: 30px; height: 120px; display: grid; grid-template-columns: 50% 50%; grid-template-rows: repeat(8, 12.5%); cursor: pointer; translate: 0 12px; }
  .side-left { transform: rotateY(-90deg) translateZ(15px) translateY(8px); }
  .side-right { transform: rotateY(0deg) translateZ(15px) translateY(8px); }
  .side-left div, .side-right div { width: 103%; height: 103%; }

  .side div:nth-child(14) { background-color: #2b2114; }
  .side div:nth-child(16) { background-color: #271e10; }

  .torch-box input:checked ~ .torch .face { filter: drop-shadow(0px 0px 2px rgb(255,255,255)) drop-shadow(0px 0px 10px rgba(255,237,156,0.7)) drop-shadow(0px 0px 25px rgba(255,227,101,0.4)); }
  .torch-box input:checked ~ .torch .top div:nth-child(1), .torch-box input:checked ~ .torch .left div:nth-child(3), .torch-box input:checked ~ .torch .right div:nth-child(3) { background-color: #ffff97; }

  /* ============ 侧边章节导航 Option Wheel ============ */
  .ow-nav {
    position: fixed;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    z-index: 60;
    width: 240px;
    height: 330px;
  }
  .ow-nav .option-wheel {
    --ow-text-color: #87878f;
    --ow-active-color: #f4f4f5;
    --ow-font-size: 1.45rem;
    --ow-inset: 22px;
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    outline: none;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 22%, #000 78%, transparent);
    mask-image: linear-gradient(to bottom, transparent, #000 22%, #000 78%, transparent);

  .projects-grid {

  .pj-card {
    position: relative;

    height: 100%;
    transform-style: preserve-3d;
    transform: perspective(1000px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));

    text-decoration: none;

    position: relative;

  .pj-card__cover-wrap {

    height: 190px;
    overflow: hidden;

  .pj-card__cover {
    width: 100%;

/* ============ True Focus · 逐字聚焦取景框 ============ */
.true-focus-heading {
  position: relative;
  display: flex;
  gap: 0.2em;
  justify-content: flex-start;
  align-items: center;
  flex-wrap: nowrap;
  outline: none;
  user-select: none;
  margin: 0;
  padding: 0;
  isolation: isolate;
}
.tf-word {
  position: relative;
  font-size: clamp(3rem, 12vw, 7rem);
  font-weight: 900;
  line-height: 1;
  letter-spacing: -0.02em;
  transition: filter 0.5s ease, color 0.5s ease, text-shadow 0.5s ease;
  outline: none;
  user-select: none;
  cursor: default;
  color: #3f3f46;
  filter: blur(6px);
}
.tf-word.tf-active {
  color: #fafafa;
  filter: blur(0);
  text-shadow: 0 0 22px rgba(103, 232, 249, 0.55), 0 2px 8px rgba(0,0,0,.4);
}
.tf-frame {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
  box-sizing: content-box;
  border: none;
  padding: 10px;
  margin: -10px 0 0 -10px;
}
.tf-corner {
  position: absolute;
  width: 1rem;
  height: 1rem;
  border: 3px solid #22d3ee;
  border-radius: 3px;
  box-shadow:
    0 0 8px rgba(34, 211, 238, 0.7),
    0 0 18px rgba(34, 211, 238, 0.35);
  transition: none;
}
.tf-corner.tf-tl { top: 0; left: 0; border-right: none; border-bottom: none; }
.tf-corner.tf-tr { top: 0; right: 0; border-left: none; border-bottom: none; }
.tf-corner.tf-bl { bottom: 0; left: 0; border-right: none; border-top: none; }
.tf-corner.tf-br { bottom: 0; right: 0; border-left: none; border-top: none; }
.tf-scanline {
  position: absolute;
  left: 5%;
  right: 5%;
  top: 50%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(34,211,238,0.8), transparent);
  opacity: 0.55;
  transform: translateY(-50%);
}
@media (max-width: 640px) {
  .tf-word { filter: blur(4px); }
}

/* ============ Depth Text · 3D 多层立体文字 ============ */
.depth-text {
  display: inline-block;
  perspective: var(--depth-text-perspective, 900px);
  perspective-origin: 50% 48%;
  isolation: isolate;
  line-height: 0.86;
}
.depth-text__stage {
  position: relative;
  display: inline-grid;
  place-items: center;
  transform-style: preserve-3d;
  transform: rotateX(-2.4deg) rotateY(3.15deg);
  transform-origin: 50% 50%;
  will-change: transform;
}
.depth-text__layer,
.depth-text__face {
  grid-area: 1 / 1;
  display: inline-block;
  font-size: var(--depth-text-font-size, clamp(3rem, 12vw, 7rem));
  font-weight: var(--depth-text-font-weight, 900);
  line-height: 0.86;
  letter-spacing: -0.065em;
  white-space: nowrap;
  user-select: none;
  transform-style: preserve-3d;
  backface-visibility: hidden;
  font-kerning: normal;
  text-rendering: geometricPrecision;
  margin: 0;
}
.depth-text__layer {
  position: absolute;
  inset: 0;
  z-index: 0;
  filter: saturate(0.95) brightness(0.92);
  pointer-events: none;
}
.depth-text__face {
  position: relative;
  z-index: 1;
  color: var(--depth-text-face-color, #f8fafc);
  text-shadow: var(--depth-text-shadow, none);
  transform: translateZ(0.6px);
}
@media (hover: hover) and (pointer: fine) {
  .depth-text { cursor: default; }
}
@media (prefers-reduced-motion: reduce) {
  .depth-text__stage { will-change: auto; }
}

/* ================== 工具函数 ================== */
function $(sel) { return document.querySelector(sel); }

function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('opacity-100');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('opacity-100'), 2000);
}

/* 气泡反馈（点击处） */
function showBubble(x, y, text) {
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  b.style.left = x + 'px';
  b.style.top = y + 'px';
  document.body.appendChild(b);
  requestAnimationFrame(() => b.classList.add('show'));
  setTimeout(() => { b.classList.remove('show'); setTimeout(() => b.remove(), 300); }, 1600);
}

function copyText(text, label) {
  if (!text) { showToast('暂无可复制内容'); return; }
  navigator.clipboard.writeText(text).then(() => {
    showToast(label + '已复制');
  }).catch(() => {
    showToast(label + '：' + text);
  });
}

/* ================== 顶部滚动进度条 ================== */
function initProgressBar() {
  const bar = $('#progress');
  let ticking = false;
  function update() {
    const doc = document.documentElement;
    const max = doc.scrollHeight - doc.clientHeight;
    const pct = max > 0 ? (window.scrollY / max) * 100 : 0;
    bar.style.width = pct + '%';
    ticking = false;
  }
  window.addEventListener('scroll', () => {
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
  }, { passive: true });
  update();
}

/* ================== 打字机 ================== */
function initTyping() {
  const el = $('#typedText');
  const phrases = resume.phrases;
  let pi = 0, ci = 0, deleting = false;
  const TYPE = 90, DEL = 45, HOLD = 1500;

  function tick() {
    const phrase = phrases[pi];
    if (!deleting) {
      ci++;
      el.textContent = phrase.slice(0, ci);
      if (ci === phrase.length) { deleting = true; setTimeout(loop, HOLD); return; }
    } else {
      ci--;
      el.textContent = phrase.slice(0, ci);
      if (ci === 0) { deleting = false; pi = (pi + 1) % phrases.length; }
    }
    setTimeout(loop, deleting ? DEL : TYPE);
  }
  function loop() { tick(); }
  loop();
}

/* ================== 滚动渐入（IntersectionObserver） ================== */
function initReveal() {
  const els = Array.from(document.querySelectorAll('[data-reveal]'));
  els.forEach(el => {
    const delay = parseInt(el.getAttribute('data-reveal-delay') || '0', 10);
    el.classList.add('reveal');
    if (delay) el.style.transitionDelay = delay + 'ms';
  });
  if (!('IntersectionObserver' in window)) {
    els.forEach(el => el.classList.add('is-visible'));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
  els.forEach(el => io.observe(el));
}

/* ================== 彩带粒子（原生 Canvas） ================== */
const confettiCanvas = () => $('#confettiCanvas');
let confettiParts = [];
let confettiRunning = false;
let DPR = 1;

function resizeConfettiCanvas() {
  const c = confettiCanvas();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  c.width = window.innerWidth * DPR;
  c.height = window.innerHeight * DPR;
}

function launchConfetti(x, y) {
  resizeConfettiCanvas();
  const colors = ['#22d3ee', '#34d399', '#fbbf24', '#fb7185', '#a78bfa', '#f472b6'];
  const count = 90;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 8 + 3;
    confettiParts.push({
      x: x || window.innerWidth / 2,
      y: y || window.innerHeight / 2,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 4,
      w: Math.random() * 6 + 4,
      h: Math.random() * 9 + 5,
      color: colors[(Math.random() * colors.length) | 0],
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.3,
      life: 1,
      decay: 0.012 + Math.random() * 0.014,
    });
  }
  if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(stepConfetti); }
}

function stepConfetti() {
  const c = confettiCanvas();
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  confettiParts = confettiParts.filter(p => p.life > 0);
  for (const p of confettiParts) {
    p.vy += 0.25;
    p.vx *= 0.98;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vr;
    p.life -= p.decay;
    ctx.save();
    ctx.translate(p.x * DPR, p.y * DPR);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.fillRect(-p.w * DPR / 2, -p.h * DPR / 2, p.w * DPR, p.h * DPR);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  if (confettiParts.length) {
    requestAnimationFrame(stepConfetti);
  } else {
    confettiRunning = false;
    ctx.clearRect(0, 0, c.width, c.height);
  }
}

/* ================== 兴趣联动（桌面磁吸+悬停 / 移动点击） ================== */
function bindInterests() {
  const tagsEl = $('#interestTags');
  if (!tagsEl) return;
  const tagEls = () => tagsEl.querySelectorAll('.interest-tag');
  const cards = () => document.querySelectorAll('.interest-card');
  const isCoarse = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function activate(cat) {
    tagEls().forEach(t => t.classList.toggle('active', +t.dataset.cat === cat));
    cards().forEach(c => c.classList.toggle('active', +c.dataset.cat === cat));
  }
  function clearActive() {
    tagEls().forEach(t => t.classList.remove('active'));
    cards().forEach(c => c.classList.remove('active'));
  }

  if (isCoarse) {
    tagsEl.addEventListener('click', (e) => {
      const t = e.target.closest('.interest-tag');
      if (!t) return;
      if (t.classList.contains('active')) clearActive(); else activate(+t.dataset.cat);
    });
    return;
  }

  tagsEl.addEventListener('mouseover', (e) => {
    const t = e.target.closest('.interest-tag');
    if (t) activate(+t.dataset.cat);
  });
  tagsEl.addEventListener('mouseleave', clearActive);

  if (reduced) return;

  let raf = null, lastEvt = null;
  function applyMagnet(e) {
    lastEvt = e;
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = null;
      const ev = lastEvt;
      tagEls().forEach(t => {
        const r = t.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        const dx = ev.clientX - cx, dy = ev.clientY - cy;
        const dist = Math.hypot(dx, dy);
        const R = 110;
        if (dist < R) {
          const k = 1 - dist / R;
          const mx = (-dx / R) * 16 * k;
          const my = (-dy / R) * 16 * k;
          t.style.transform = `translate(${mx.toFixed(1)}px, ${my.toFixed(1)}px)`;
        } else if (t.style.transform) {
          t.style.transform = '';
        }
      });
    });
  }
  function resetMagnet() {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    tagEls().forEach(t => { t.style.transform = ''; });
  }
  tagsEl.addEventListener('mousemove', applyMagnet);
  tagsEl.addEventListener('mouseleave', resetMagnet);
}

            ${g.tags.map(t => `<span class="pj-card__tag">${t}</span>`).join('')}
          </div>
          <span class="pj-card__play">${svgPlay}开始游戏</span>
        </div>
      </div>
    </a>
  `).join('');
}

function bindGameTilt() {
  if (shouldDisableTilt()) return;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cards = document.querySelectorAll('[data-project-tilt]');
  cards.forEach(card => {
    const max = parseFloat(card.getAttribute('data-project-tilt-max') || '8');
    let raf = null;
    let tx = 0, ty = 0, rx = 0, ry = 0;
    function loop() {
      rx += (tx - rx) * 0.18;
      ry += (ty - ry) * 0.18;
      card.style.setProperty('--rx', rx.toFixed(2) + 'deg');
      card.style.setProperty('--ry', ry.toFixed(2) + 'deg');
      if (Math.abs(tx - rx) > 0.02 || Math.abs(ty - ry) > 0.02) raf = requestAnimationFrame(loop);
      else raf = null;
    }
    function onMove(e) {
      if (reduced) return;
      const rect = card.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width;
      const py = (e.clientY - rect.top) / rect.height;
      tx = -(py - 0.5) * max;
      ty = (px - 0.5) * max;
      if (!raf) raf = requestAnimationFrame(loop);
    }
    function onLeave() {
      tx = 0; ty = 0;
      if (!raf) raf = requestAnimationFrame(loop);
    }
    card.addEventListener('mousemove', onMove);
    card.addEventListener('mouseleave', onLeave);
  });
}

/* ================== 3D Tilt（移动端降级） ================== */
let tiltInstances = [];
function shouldDisableTilt() {
  return window.innerWidth < 768
    || ('ontouchstart' in window)
    || navigator.maxTouchPoints > 0
    || window.matchMedia('(pointer: coarse)').matches;
}
function enableTilt() {
  if (typeof VanillaTilt === 'undefined') return;
  // VanillaTilt.init 不返回实例数组，实例挂在元素的 vanillaTilt 属性上
  var els = Array.from(document.querySelectorAll('[data-tilt]'));
  VanillaTilt.init(els);
  tiltInstances = els.map(el => el.vanillaTilt).filter(Boolean);
}
function disableTilt() {
  tiltInstances.forEach(t => t && t.destroy && t.destroy());
  tiltInstances = [];
}
function syncTilt() {
  if (shouldDisableTilt()) { disableTilt(); }
  else if (!tiltInstances.length) { enableTilt(); }
}

/* ================== 主题切换（火把 · 白天/黑夜） ================== */
function initTheme() {
  const toggle = $('#lightToggle');
  if (!toggle) return;
  function apply(light) {
    document.documentElement.classList.toggle('light', light);
    toggle.checked = light;
  }
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) { saved = null; }
  apply(saved === 'light');
  toggle.addEventListener('change', () => {
    apply(toggle.checked);
    try { localStorage.setItem('theme', toggle.checked ? 'light' : 'dark'); } catch (e) {}
  });
}

/* ================== True Focus · 逐字聚焦取景框 ================== */
function initTrueFocus(target, opts) {
  opts = opts || {};
  var sentence = opts.sentence || '庞俊熙';
  var separator = opts.separator != null ? opts.separator : '';
  var manualMode = opts.manualMode === true;
  var blurAmount = opts.blurAmount != null ? opts.blurAmount : 5;
  var borderColor = opts.borderColor || '#22d3ee';
  var glowColor = opts.glowColor || 'rgba(34, 211, 238, 0.6)';
  var animationDuration = opts.animationDuration != null ? opts.animationDuration : 0.5;
  var pauseBetweenAnimations = opts.pauseBetweenAnimations != null ? opts.pauseBetweenAnimations : 1;
  var fontSize = opts.fontSize || 'clamp(3rem, 12vw, 7rem)';
  var fontWeight = opts.fontWeight != null ? opts.fontWeight : 900;
  var scanline = opts.scanline !== false;
  var words = separator === '' ? sentence.split('') : sentence.split(separator);
  var root = typeof target === 'string' ? document.querySelector(target) : target;
  if (!root) return;

  var blurActive = 0;
  var blurInactive = blurAmount;
  var activeIndex = 0;
  var lastActiveIndex = 0;
  var frameId = null;
  var tweenRef = null;

  var wordsHtml = words.map(function(w, i) {
    var isActive = i === activeIndex;
    var color = isActive ? '#fafafa' : '#3f3f46';
    var blurVal = isActive ? blurActive : blurInactive;
    var shadow = isActive ? '0 0 22px ' + glowColor + ', 0 2px 8px rgba(0,0,0,.4)' : 'none';
    return '<span data-idx="' + i + '" class="tf-word' + (manualMode ? ' manual' : '') + (isActive ? ' tf-active' : '') + '"' +
      ' style="font-size:' + fontSize + ';font-weight:' + fontWeight + ';filter:blur(' + blurVal + 'px);color:' + color + ';text-shadow:' + shadow + ';' +
      'transition:filter ' + animationDuration + 's ease,color ' + animationDuration + 's ease,text-shadow ' + animationDuration + 's ease;">' +
      (w === ' ' ? '&nbsp;' : w) + '</span>';
  }).join('');

  var cornersHtml =
    '<span class="tf-corner tf-tl"></span>' +
    '<span class="tf-corner tf-tr"></span>' +
    '<span class="tf-corner tf-bl"></span>' +
    '<span class="tf-corner tf-br"></span>' +
    (scanline ? '<span class="tf-scanline"></span>' : '');

  root.innerHTML = wordsHtml + '<div class="tf-frame" style="--tf-border:' + borderColor + ';">' + cornersHtml + '</div>';
  var frame = root.querySelector('.tf-frame');
  if (!frame) return;

  var wordEls = root.querySelectorAll('.tf-word');

  function measure() {
    var parentRect = root.getBoundingClientRect();
    var el = wordEls[activeIndex];
    if (!el) return { x: 0, y: 0, w: 0, h: 0 };
    var r = el.getBoundingClientRect();
    return { x: r.left - parentRect.left, y: r.top - parentRect.top, w: r.width, h: r.height };
  }

  function applyFrame(rect) {
    frame.style.transform = 'translate(' + rect.x + 'px, ' + rect.y + 'px)';
    frame.style.width = rect.w + 'px';
    frame.style.height = rect.h + 'px';
  }

  function setActive(idx) {
    activeIndex = (idx + words.length) % words.length;
    wordEls.forEach(function(w, i) {
      var isActive = i === activeIndex;
      w.classList.toggle('tf-active', isActive && !manualMode);
      w.style.color = isActive ? '#fafafa' : '#3f3f46';
      w.style.filter = 'blur(' + (isActive ? blurActive : blurInactive) + 'px)';
      if (isActive) {
        w.style.textShadow = '0 0 22px ' + glowColor + ', 0 2px 8px rgba(0,0,0,.4)';
      } else {
        w.style.textShadow = 'none';
      }
    });
    var rect = measure();
    if (window.gsap && tweenRef && tweenRef.kill) tweenRef.kill();
    if (window.gsap) {
      if (tweenRef) tweenRef = null;
      tweenRef = gsap.to(frame, {
        x: rect.x, y: rect.y, width: rect.w, height: rect.h,
        duration: animationDuration,
        ease: 'power3.inOut',
        overwrite: 'auto'
      });
    } else {
      applyFrame(rect);
    }
  }

  if (wordEls.length) {
    var initRect = measure();
    applyFrame(initRect);
    requestAnimationFrame(function() { setActive(activeIndex); });
  }

  if (!manualMode) {
    frameId = setInterval(function() {
      lastActiveIndex = activeIndex;
      setActive(activeIndex + 1);
    }, (animationDuration + pauseBetweenAnimations) * 1000);
  }

  wordEls.forEach(function(el, i) {
    el.addEventListener('mouseenter', function() {
      if (manualMode) { lastActiveIndex = i; setActive(i); }
    });
    el.addEventListener('mouseleave', function() {
      if (manualMode) { setActive(lastActiveIndex); }
    });
  });

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function() { setTimeout(function() {
      var r = measure();
      if (window.gsap) { gsap.set(frame, { x: r.x, y: r.y, width: r.w, height: r.h }); }
      else applyFrame(r);
    }, 50); }).catch(function(){});
  }
  var resizeT;
  window.addEventListener('resize', function() {
    clearTimeout(resizeT);
    resizeT = setTimeout(function() {
      var r = measure();
      if (window.gsap) { gsap.to(frame, { x: r.x, y: r.y, width: r.w, height: r.h, duration: 0.25, ease: 'power3.out' }); }
      else applyFrame(r);
    }, 80);
  });

  return {
    destroy: function() {
      clearInterval(frameId);
      if (tweenRef && tweenRef.kill) tweenRef.kill();
    }
  };
}

/* ================== Depth Text · 3D 多层立体文字 ================== */
function initDepthText(target, opts) {
  opts = opts || {};
  var MAX_LAYERS = 64;
  function clamp(v, a, b) { return Math.min(Math.max(v, a), b); }
  function hexToRgb(hex) {
    hex = hex.replace('#','');
    if (hex.length === 3) hex = hex.split('').map(function(c){return c+c;}).join('');
    return [parseInt(hex.substring(0,2),16), parseInt(hex.substring(2,4),16), parseInt(hex.substring(4,6),16)];
  }
  function colorMix(faceHex, depthHex, facePct) {
    var f = hexToRgb(faceHex), d = hexToRgb(depthHex);
    var r = Math.round(f[0] * facePct + d[0] * (1-facePct));
    var g = Math.round(f[1] * facePct + d[1] * (1-facePct));
    var b = Math.round(f[2] * facePct + d[2] * (1-facePct));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function getLayerColor(face, depth, idx, total) {
    var p = total <= 1 ? 1 : idx / total;
    var eased = p * p;
    var faceMixPct = ((1 - eased) * 72 + 4) / 100;
    return colorMix(face, depth, faceMixPct);
  }
  function getTransform(rx, ry) { return 'rotateX(' + rx.toFixed(3) + 'deg) rotateY(' + ry.toFixed(3) + 'deg)'; }

  var text = opts.text || (target && target.getAttribute && target.getAttribute('data-depth-text')) || 'Text';
  var layers = clamp(Math.round(Number(opts.layers || 34)), 2, MAX_LAYERS);
  var depth = clamp(Number(opts.depth || 2.4), 0, 12);
  var faceColor = opts.faceColor || '#f4f4f5';
  var depthColor = opts.depthColor || '#7c3aed';
  var tilt = clamp(Number(opts.tilt || 7.5), 0, 12);
  var pointerTracking = opts.pointerTracking !== false;
  var smoothing = clamp(Number(opts.smoothing || 0.14), 0.02, 0.35);
  var perspective = clamp(Number(opts.perspective || 900), 300, 2000);
  var autoOrbit = opts.autoOrbit !== false;
  var orbitSpeed = clamp(Number(opts.orbitSpeed || 0.35), 0, 2);
  var fontSize = opts.fontSize || 'clamp(3rem, 12vw, 7rem)';
  var fontWeight = opts.fontWeight != null ? opts.fontWeight : 900;
  var shadow = opts.shadow !== false;

  var baseRot = { x: -tilt * 0.32, y: tilt * 0.42 };
  var root = typeof target === 'string' ? document.querySelector(target) : target;
  if (!root) return;

  // 构建 DOM
  root.classList.add('depth-text');
  if (opts.className) root.classList.add(opts.className);
  root.style.setProperty('--depth-text-perspective', perspective + 'px');
  root.style.setProperty('--depth-text-font-size', fontSize);
  root.style.setProperty('--depth-text-font-weight', fontWeight);
  root.style.setProperty('--depth-text-face-color', faceColor);
  root.style.setProperty('--depth-text-depth-color', depthColor);
  if (shadow) {
    var dp = hexToRgb(depthColor);
    var shadowColor = 'rgba(' + dp[0] + ',' + dp[1] + ',' + dp[2] + ',0.36)';
    root.style.setProperty('--depth-text-shadow',
      '0 22px 34px ' + shadowColor + ', 0 4px 8px rgba(0,0,0,0.28)');
  } else {
    root.style.setProperty('--depth-text-shadow', 'none');
  }
  if (opts.style && typeof opts.style === 'object') {
    Object.keys(opts.style).forEach(function(k) { root.style[k] = opts.style[k]; });
  }

  var html = '<span class="depth-text__stage" aria-label="' + text + '">';
  for (var layerIndex = 0; layerIndex < layers; layerIndex++) {
    var idx = layers - layerIndex;
    var color = getLayerColor(faceColor, depthColor, idx, layers);
    var tr = 'translateZ(' + (-idx * depth) + 'px)';
    html += '<span aria-hidden="true" class="depth-text__layer" style="color:' + color + ';transform:' + tr + ';">' + text + '</span>';
  }
  html += '<span class="depth-text__face">' + text + '</span>';
  html += '</span>';
  root.innerHTML = html;
  root.setAttribute('aria-label', text);

  var stage = root.querySelector('.depth-text__stage');
  if (!stage || typeof window === 'undefined') return;

  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var finePointer = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  var canTrackPointer = pointerTracking && finePointer && !reducedMotion;

  var frameId = 0;
  var activePointer = false;
  var startTime = performance.now();
  var current = { x: baseRot.x, y: baseRot.y };
  var targetRot = { x: baseRot.x, y: baseRot.y };

  function applyT() { stage.style.transform = getTransform(current.x, current.y); }
  if (reducedMotion) { stage.style.transform = getTransform(baseRot.x, baseRot.y); return; }

  function handlePointerMove(e) {
    var rect = root.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    activePointer = true;
    var x = clamp((e.clientX - (rect.left + rect.width/2)) / (rect.width * 0.8), -1, 1);
    var y = clamp((e.clientY - (rect.top + rect.height/2)) / (rect.height * 0.8), -1, 1);
    targetRot.x = baseRot.x - y * tilt;
    targetRot.y = baseRot.y + x * tilt;
  }
  function handlePointerLeave() {
    activePointer = false;
    targetRot.x = baseRot.x;
    targetRot.y = baseRot.y;
  }
  if (canTrackPointer) {
    window.addEventListener('pointermove', handlePointerMove);
    window.addEventListener('pointerleave', handlePointerLeave);
    window.addEventListener('blur', handlePointerLeave);
  }
  function tick(now) {
    if ((!canTrackPointer || !activePointer) && autoOrbit) {
      var elapsed = (now - startTime) / 1000;
      var orbit = elapsed * orbitSpeed * Math.PI * 2;
      var fallbackAmount = canTrackPointer ? 0.18 : 0.55;
      targetRot.x = baseRot.x + Math.sin(orbit) * tilt * fallbackAmount;
      targetRot.y = baseRot.y + Math.cos(orbit * 0.85) * tilt * fallbackAmount;
    }
    current.x += (targetRot.x - current.x) * smoothing;
    current.y += (targetRot.y - current.y) * smoothing;
    applyT();
    frameId = requestAnimationFrame(tick);
  }
  applyT();
  frameId = requestAnimationFrame(tick);

  return {
    destroy: function() {
      cancelAnimationFrame(frameId);
      if (canTrackPointer) {
        window.removeEventListener('pointermove', handlePointerMove);
        window.removeEventListener('pointerleave', handlePointerLeave);
        window.removeEventListener('blur', handlePointerLeave);
      }
    }
  };
}

/* ================== Accordion Gallery · 手风琴画廊 ================== */
function initAccordionGallery(container, items, opts) {
  opts = opts || {};
  var settings = {
    defaultIndex: opts.defaultIndex != null ? opts.defaultIndex : (items.length > 3 ? 2 : 0),
    accentColor: opts.accentColor || '#22d3ee',
    overlayColor: opts.overlayColor || '#0a0a0a',
    textColor: opts.textColor || '#f4f4f5',
    height: opts.height || 420,
    gap: opts.gap != null ? opts.gap : 10,
    radius: opts.radius || 16,
    expandRatio: opts.expandRatio != null ? opts.expandRatio : 0.52,
    duration: opts.duration || 0.6,
    ease: opts.ease || 'power3.out',
    parallax: opts.parallax != null ? opts.parallax : 0.5,
    tilt: opts.tilt || 8,
    stagger: opts.stagger || 0.06,
    trigger: opts.trigger || 'hover',
    showLabels: opts.showLabels !== false,
    grayscale: opts.grayscale !== false,
    mobileMode: opts.mobileMode || 'auto',  // 'auto' | 'accordion' | 'grid'
  };
  var count = items.length;
  if (count === 0) return;
  var active = Math.min(Math.max(settings.defaultIndex, 0), count - 1);
  var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var mediaSizeVal = 320;
  var tlRef = null;
  var firstRun = true;

  // 构建 DOM
  container.className = 'accordion-gallery';
  container.style.setProperty('--ag-accent', settings.accentColor);
  container.style.setProperty('--ag-overlay', settings.overlayColor);
  container.style.setProperty('--ag-text', settings.textColor);
  container.style.setProperty('--ag-gap', settings.gap + 'px');
  container.style.setProperty('--ag-radius', settings.radius + 'px');
  container.style.height = settings.height + 'px';
  container.setAttribute('role', 'list');
  container.setAttribute('aria-label', 'Image accordion gallery');

  var panelRefs = [];
  var mediaRefs = [];
  var barRefs = [];
  var textRefs = [];

  container.innerHTML = items.map(function(item, i) {
    var isActive = i === active;
    var labelHtml = settings.showLabels ? '<span class="ag-panel__label" aria-hidden="true">' +
      '<span class="ag-panel__bar"></span>' +
      '<span class="ag-panel__text">' + (item.label || '') + '</span>' +
      '</span>' : '';
    return '<div class="ag-panel' + (isActive ? ' ag-panel--active' : '') + '"' +
      ' style="border-radius:' + settings.radius + 'px"' +
      (item.link ? ' data-link="' + item.link + '"' : '') +
      ' role="listitem" tabindex="0" aria-current="' + (isActive ? 'true' : 'false') + '"' +
      ' aria-label="' + (item.label || '') + '"' +
      ' data-ag-index="' + i + '">' +
      '<span class="ag-panel__frame">' +
      '<span class="ag-panel__media"><img src="' + item.image + '" alt="' + (item.alt || item.label || '') + '" draggable="false" loading="lazy"></span>' +
      '<span class="ag-panel__overlay"></span>' +
      '</span>' + labelHtml + '</div>';
  }).join('');

  var panels = container.querySelectorAll('.ag-panel');
  panels.forEach(function(p, i) {
    panelRefs.push(p);
    mediaRefs.push(p.querySelector('.ag-panel__media'));
    barRefs.push(p.querySelector('.ag-panel__bar'));
    textRefs.push(p.querySelector('.ag-panel__text'));
  });

  function applyLayout(animate) {
    if (!panelRefs.length) return;
    var r = Math.min(Math.max(settings.expandRatio, 0.2), 0.9);
    var grow = count > 1 ? (r * (count - 1)) / (1 - r) : 1;
    var mediaSize = mediaSizeVal;
    if (tlRef) tlRef.kill();
    var dur = animate && !prefersReduced ? settings.duration : 0;
    var tl = window.gsap ? gsap.timeline() : { to: function() { return this; }, kill: function(){} };

    panelRefs.forEach(function(panel, i) {
      if (!panel) return;
      var isActive = i === active;
      panel.classList.toggle('ag-panel--active', isActive);
      panel.setAttribute('aria-current', isActive ? 'true' : 'false');
      var media = mediaRefs[i];
      var bar = barRefs[i];
      var text = textRefs[i];
      var rot = isActive ? 0 : (i < active ? settings.tilt : -settings.tilt);
      tl.to(panel, { flexGrow: isActive ? grow : 1, rotateY: rot, duration: dur, ease: settings.ease }, 0);
      if (media) {
        var drift = Math.max(-1.5, Math.min(1.5, active - i));
        var shift = drift * settings.parallax * mediaSize * 0.06;
        var gray = settings.grayscale ? (isActive ? 0 : 1) : 0;
        tl.to(media, {
          xPercent: -50, yPercent: -50,
          x: isActive ? 0 : shift,
          '--ag-gray': gray,
          '--ag-dim': isActive ? 0 : 0.35,
          duration: dur, ease: settings.ease
        }, 0);
      }
      if (settings.showLabels && bar && text) {
        if (isActive) {
          tl.to([bar, text], { opacity: 1, x: 0, duration: dur, ease: settings.ease, stagger: prefersReduced ? 0 : settings.stagger }, 0);
        } else {
          tl.to([bar, text], { opacity: 0, x: -14, duration: dur * 0.6, ease: settings.ease }, 0);
        }
      }
    });
    tlRef = tl;
  }

  function measure() {
    var rect = container.getBoundingClientRect();
    var total = rect.width;
    var usable = Math.max(total - settings.gap * (count - 1), 120);
    var size = Math.max(140, usable * Math.min(Math.max(settings.expandRatio, 0.2), 0.9) * 1.22);
    mediaSizeVal = size;
    container.style.setProperty('--ag-media-size', size + 'px');
    applyLayout(!firstRun);
  }

  measure();
  var ro = new ResizeObserver(measure);
  ro.observe(container);

  // 事件
  var isTouch = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || window.innerWidth <= 640 || 'ontouchstart' in window;
  panels.forEach(function(panel, i) {
    panel.addEventListener('mouseenter', function() {
      if (!isTouch && settings.trigger === 'hover') { active = i; applyLayout(true); }
    });
    panel.addEventListener('focus', function() {
      active = i; applyLayout(true);
    });
    panel.addEventListener('click', function() {
      var link = panel.getAttribute('data-link');
      if (i !== active) {
        active = i; applyLayout(true);
      } else if (link) {
        window.open(link, '_blank', 'noopener');
      }
    });
    panel.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        var link = panel.getAttribute('data-link');
        if (i !== active) { active = i; applyLayout(true); }
        else if (link) { window.open(link, '_blank', 'noopener'); }
      } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        e.preventDefault(); active = (i + 1) % count; applyLayout(true);
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault(); active = (i - 1 + count) % count; applyLayout(true);
      }
    });
  });

  // 首次入场动画
  function syncMobileMode() {
    var isMobile = window.innerWidth <= 640;
    var mode;
    if (settings.mobileMode === 'grid') mode = isMobile ? 'grid' : 'accordion';
    else if (settings.mobileMode === 'accordion') mode = 'accordion';
    else mode = (isMobile && count > 6) ? 'grid' : (isMobile ? 'accordion' : 'accordion');
    if (mode === 'grid') container.setAttribute('data-ag-mobile', 'grid');
    else container.removeAttribute('data-ag-mobile');
    if (mode !== 'accordion') {
      if (tlRef && tlRef.kill) tlRef.kill();
      tlRef = null;
      panels.forEach(function(p) {
        var m = p.querySelector('.ag-panel__media');
        var bar = p.querySelector('.ag-panel__bar');
        var txt = p.querySelector('.ag-panel__text');
        p.style.flexGrow = '';
        p.style.rotateY = '';
        p.style.transform = '';
        if (bar) bar.style.opacity = '';
        if (txt) { txt.style.opacity = ''; txt.style.transform = ''; }
      });
    }
  }

  requestAnimationFrame(function() {
    applyLayout(false);
    firstRun = false;
    syncMobileMode();
    setTimeout(function() { applyLayout(true); }, 100);
  });

  if (window.matchMedia) {
    var mql = window.matchMedia('(max-width: 640px)');
    var listener = function() { syncMobileMode(); if (container.getAttribute('data-ag-mobile') !== 'grid') { measure(); applyLayout(true); } };
    if (mql.addEventListener) mql.addEventListener('change', listener);
    else if (mql.addListener) mql.addListener(listener);
  }

  return { destroy: function() { ro.disconnect(); if (tlRef && tlRef.kill) tlRef.kill(); if (mql) { if (mql.removeEventListener) mql.removeEventListener('change', listener); else if (mql.removeListener) mql.removeListener(listener); } } };
}

/* ================== Drift Wall · 证书漂移墙 ================== */
function initDriftWall(target, opts) {
  var root = typeof target === 'string' ? document.querySelector(target) : target;
  if (!root) return null;
  opts = opts || {};
  var items = opts.items || [];
  if (!items.length) return null;

  var tileW = opts.tileWidth || 176;
  var tileH = opts.tileHeight || 235;
  var gap = opts.gap != null ? opts.gap : 16;
  var radius = opts.radius != null ? opts.radius : 12;
  var tilt = opts.tilt != null ? opts.tilt : 14;
  var turn = opts.turn != null ? opts.turn : -12;
  var roll = opts.roll != null ? opts.roll : 0;
  var perspective = opts.perspective != null ? opts.perspective : 1200;
  var depth = opts.depth != null ? opts.depth : 110;
  var speed = opts.speed != null ? opts.speed : 40;
  var direction = opts.direction || 'up';
  var variance = opts.variance != null ? opts.variance : 0.45;
  var parallax = opts.parallax != null ? opts.parallax : 0.5;
  var pauseOnHover = !!opts.pauseOnHover;
  var lift = opts.lift != null ? opts.lift : 60;
  var fade = opts.fade != null ? opts.fade : 0.6;
  var dim = opts.dim != null ? opts.dim : 0.55;
  var grayscale = !!opts.grayscale;
  var overlayColor = opts.overlayColor || '#05060a';
  var onClick = opts.onClick || null;

  var isTouch = window.matchMedia && window.matchMedia('(hover: none)').matches;
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function colFactor(index, variance) {
    var pseudo = ((index * 0.6180339887 + 0.35) % 1) * 2 - 1;
    return 1 + variance * pseudo;
  }

  var state = {
    plane: null,
    tracks: [],
    trackEls: [],
    copyHs: [],
    tileEls: [],
    groups: [],
    baseVel: [],
    th: tileH,
    cGap: gap,
    raf: null,
    offsets: [],
    velocities: [],
    hoverCol: -1,
    wallHovered: false,
    pointer: { x: 0, y: 0 },
    damped: { x: 0, y: 0 },
    lastTs: null,
    activeId: null,
    ro: null,
    resizeT: null
  };

  function applyPlaneTransform(px, py) {
    if (!state.plane) return;
    state.plane.style.transform =
      'translate(-50%, -50%) scale(1.18) ' +
      'rotateX(' + (tilt + py) + 'deg) rotateY(' + (turn + px) + 'deg) rotateZ(' + roll + 'deg) ' +
      'translateZ(' + (-depth) + 'px)';
  }

  function build() {
    var pageW = root.clientWidth || window.innerWidth || 800;
    var isSmall = pageW < 640;
    var tw = isSmall ? Math.max(116, tileW * 0.66) : tileW;
    var th = tw * (tileH / tileW);
    var cGap = isSmall ? Math.max(10, gap * 0.75) : gap;
    var cols = Math.max(2, Math.min(7, Math.floor((pageW * 0.94) / (tw + cGap))));

    root.style.setProperty('--dw-tile-w', tw + 'px');
    root.style.setProperty('--dw-tile-h', th + 'px');
    root.style.setProperty('--dw-gap', cGap + 'px');
    root.style.setProperty('--dw-perspective', perspective + 'px');
    root.style.setProperty('--dw-radius', radius + 'px');
    root.style.setProperty('--dw-lift', lift + 'px');
    root.style.setProperty('--dw-dim', dim);
    root.style.setProperty('--dw-gray', grayscale ? 1 : 0);
    root.style.setProperty('--dw-overlay', overlayColor);
    root.style.setProperty('--dw-edge', Math.max(0, (1 - fade) * 100) + '%');

    var groups = [];
    for (var c = 0; c < cols; c++) groups.push([]);
    items.forEach(function(it, i) { groups[i % cols].push(it); });
    groups = groups.map(function(g) { return g.length ? g : items.slice(0, 1); });

    var containerH = root.clientHeight || 460;
    var unit = th + cGap;
    var meta = groups.map(function(g) {
      var copyH = Math.max(unit, g.length * unit);
      var copies = Math.max(2, Math.ceil((containerH * 1.6) / copyH) + 1);
      return { copyH: copyH, copies: copies };
    });

    var dirSign = direction === 'up' ? 1 : -1;
    var baseVel = groups.map(function(_, c) {
      var altSign = c % 2 === 0 ? 1 : -1;
      return speed * colFactor(c, variance) * dirSign * altSign;
    });

    state.offsets = meta.map(function(m, c) { return m.copyH * ((c * 0.37) % 1); });
    state.velocities = groups.map(function() { return 0; });
    state.groups = groups;
    state.baseVel = baseVel;
    state.copyHs = meta.map(function(m) { return m.copyH; });
    state.th = th;
    state.cGap = cGap;

    var html = '<div class="drift-wall__plane">';
    groups.forEach(function(col, c) {
      var m = meta[c];
      html += '<div class="drift-wall__col"><div class="drift-wall__track" data-col="' + c + '">';
      for (var cp = 0; cp < m.copies; cp++) {
        col.forEach(function(it, ii) {
          var idx = c * 1000 + cp * 100 + ii;
          html += '<div class="drift-wall__tile" data-tile-id="' + idx + '" data-col="' + c + '" data-src="' + it.image + '" tabindex="0" role="button" aria-label="' + (it.title || '证书') + '">' +
            '<span class="drift-wall__inner">' +
            '<img src="' + it.image + '" alt="' + (it.title || '证书') + '" loading="lazy" decoding="async" draggable="false">' +
            '<span class="drift-wall__overlay" aria-hidden="true"></span>' +
            '</span></div>';
        });
      }
      html += '</div></div>';
    });
    html += '</div>';
    root.innerHTML = html;

    state.plane = root.querySelector('.drift-wall__plane');
    state.tracks = root.querySelectorAll('.drift-wall__track');
    state.trackEls = Array.prototype.slice.call(state.tracks);
    state.tileEls = Array.prototype.slice.call(root.querySelectorAll('.drift-wall__tile'));

    // 点击/键盘打开大图
    root.querySelectorAll('.drift-wall__tile').forEach(function(tile) {
      tile.addEventListener('click', function() {
        var src = tile.getAttribute('data-src');
        var it = null;
        for (var k = 0; k < items.length; k++) { if (items[k].image === src) { it = items[k]; break; } }
        if (it && onClick) onClick(it);
      });
      tile.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          var src = tile.getAttribute('data-src');
          var it = null;
          for (var k = 0; k < items.length; k++) { if (items[k].image === src) { it = items[k]; break; } }
          if (it && onClick) onClick(it);
        }
      });
      // 桌面端：指针进入 tile 立即高亮。
      // 不监听单卡片 pointerleave：卡片高亮时 translateZ 抬起会移出指针下方，
      // 落回又进入，导致高亮反复闪烁。高亮仅在换卡片或离开整面墙时切换。
      if (!isTouch) {
        tile.addEventListener('pointerenter', function() {
          activate(this.getAttribute('data-tile-id'), Number(this.getAttribute('data-col')));
        });
      }
    });

    if (!reduced) {
      state.lastTs = null;
      if (state.raf) cancelAnimationFrame(state.raf);
      state.raf = requestAnimationFrame(loop);
    } else {
      state.offsets.forEach(function(o, c) {
        if (state.tracks[c]) state.tracks[c].style.transform = 'translate3d(0, ' + (-o) + 'px, 0)';
      });
    }
  }

  function loop(ts) {
    if (state.lastTs === null) state.lastTs = ts;
    var dt = Math.min(0.05, Math.max(0, ts - state.lastTs) / 1000);
    state.lastTs = ts;

    var maxTilt = parallax * 8;
    var targetX = state.pointer.x * maxTilt;
    var targetY = -state.pointer.y * maxTilt;
    var damp = 1 - Math.exp(-dt / 0.12);
    state.damped.x += (targetX - state.damped.x) * damp;
    state.damped.y += (targetY - state.damped.y) * damp;
    applyPlaneTransform(state.damped.x, state.damped.y);

    if (!reduced) {
      for (var c = 0; c < state.tracks.length; c++) {
        var track = state.trackEls[c];
        if (!track) continue;
        var copyH = state.copyHs[c];
        // 悬停哪列就停哪列，其余列继续漂移
        var factor = state.hoverCol === c ? 0 : 1;
        var target = state.baseVel[c] * factor;
        var ease = 1 - Math.exp(-dt / (target === 0 ? 0.08 : 0.28));
        state.velocities[c] += (target - state.velocities[c]) * ease;
        var next = (state.offsets[c] + state.velocities[c] * dt) % copyH;
        if (next < 0) next += copyH;
        state.offsets[c] = next;
        track.style.transform = 'translate3d(0,' + (-next) + 'px,0)';
      }
    }
    state.raf = requestAnimationFrame(loop);
  }

  function activate(id, col) {
    state.activeId = id;
    state.hoverCol = col;
    var tiles = state.tileEls;
    for (var i = 0; i < tiles.length; i++) {
      tiles[i].classList.toggle('is-active', tiles[i].getAttribute('data-tile-id') === String(id));
    }
  }
  function release() {
    state.activeId = null;
    state.hoverCol = -1;
    var tiles = state.tileEls;
    for (var i = 0; i < tiles.length; i++) tiles[i].classList.remove('is-active');
  }

  function onPointerMove(e) {
    var rect = root.getBoundingClientRect();
    if (!rect.width) return;
    if (parallax > 0 && !reduced) {
      state.pointer.x = (e.clientX - rect.left) / rect.width - 0.5;
      state.pointer.y = (e.clientY - rect.top) / rect.height - 0.5;
    }
  }

  build();
  applyPlaneTransform(0, 0);

  root.addEventListener('pointermove', onPointerMove);
  root.addEventListener('pointerenter', function() { state.wallHovered = true; });
  root.addEventListener('pointerleave', function() {
    state.wallHovered = false;
    state.pointer.x = 0; state.pointer.y = 0;
    release();
  });
  if (isTouch) {
    // 触屏：不做 hover 激活（避免干扰点击），仅视差跟随
    root.addEventListener('touchstart', function(e) {
      var t = e.touches[0];
      var rect = root.getBoundingClientRect();
      if (parallax > 0 && !reduced && rect.width) {
        state.pointer.x = (t.clientX - rect.left) / rect.width - 0.5;
        state.pointer.y = (t.clientY - rect.top) / rect.height - 0.5;
      }
    }, { passive: true });
  }

  if (typeof ResizeObserver !== 'undefined') {
    var schedule = function() {
      clearTimeout(state.resizeT);
      state.resizeT = setTimeout(function() {
        build();
        applyPlaneTransform(state.damped.x, state.damped.y);
      }, 160);
    };
    state.ro = new ResizeObserver(schedule);
    state.ro.observe(root);
  }

  // 不可见时暂停 rAF
  if (typeof IntersectionObserver !== 'undefined') {
    var visObs = new IntersectionObserver(function(entries) {
      var vis = entries[0] && entries[0].isIntersecting;
      if (vis && !state.raf && !reduced) {
        state.lastTs = null;
        state.raf = requestAnimationFrame(loop);
      } else if (!vis && state.raf) {
        cancelAnimationFrame(state.raf);
        state.raf = null;
      }
    }, { threshold: 0.01 });
    visObs.observe(root);
  }

  return {
    destroy: function() {
      if (state.raf) cancelAnimationFrame(state.raf);
      if (state.ro) state.ro.disconnect();
      if (state.resizeT) clearTimeout(state.resizeT);
      root.innerHTML = '';
    }
  };
}

/* ================== TextLoop 循环路径文字背景 ================== */
function initTextLoopBg(opts) {
  opts = opts || {};
  var container = document.getElementById('textLoopBg');
  if (!container) return;
  if (document.documentElement.classList.contains('light')) return;
  var VIEW_W = opts.viewWidth || 1600;
  var VIEW_H = opts.viewHeight || 900;
  var CX = VIEW_W / 2;
  var CY = VIEW_H / 2;
  var EDGE_PAD = 6;
  var text = opts.text || 'DONE IS BETTER THAN PERFECT';
  var shape = opts.shape || 'wave';
  var speed = opts.speed != null ? opts.speed : 100;
  var direction = opts.direction || 'forward';
  var separator = opts.separator != null ? opts.separator : '✦';
  var curviness = opts.curviness != null ? opts.curviness : 100;
  var fontSize = opts.fontSize || 48;
  var fontWeight = opts.fontWeight != null ? opts.fontWeight : 800;
  var letterSpacing = opts.letterSpacing != null ? opts.letterSpacing : 2;
  var uppercase = opts.uppercase !== false;
  var color = opts.color || '#22d3ee';
  var ribbon = opts.ribbon !== false;
  var ribbonColor = opts.ribbonColor || '#6366f1';
  var ribbonWidth = opts.ribbonWidth || 100;
  var pauseOnHover = opts.pauseOnHover !== false;

  function buildPath() {
    var c = Math.max(0, curviness);
    var room = Math.max(20, CY - Math.max(0, ribbonWidth) / 2 - EDGE_PAD);
    switch (shape) {
      case 'circle': {
        var r = Math.min(90 + c * 0.95, room);
        return 'M ' + (CX - r) + ' ' + CY + ' A ' + r + ' ' + r + ' 0 1 1 ' + (CX + r) + ' ' + CY + ' A ' + r + ' ' + r + ' 0 1 1 ' + (CX - r) + ' ' + CY + ' Z';
      }
      case 'infinity': {
        var ri = 150 + c * 1.4;
        var h = Math.min(60 + c * 0.95, room);
        return [
          'M ' + CX + ' ' + CY,
          'C ' + (CX + ri * 0.55) + ' ' + (CY - h) + ' ' + (CX + ri) + ' ' + (CY - h) + ' ' + (CX + ri) + ' ' + CY,
          'C ' + (CX + ri) + ' ' + (CY + h) + ' ' + (CX + ri * 0.55) + ' ' + (CY + h) + ' ' + CX + ' ' + CY,
          'C ' + (CX - ri * 0.55) + ' ' + (CY - h) + ' ' + (CX - ri) + ' ' + (CY - h) + ' ' + (CX - ri) + ' ' + CY,
          'C ' + (CX - ri) + ' ' + (CY + h) + ' ' + (CX - ri * 0.55) + ' ' + (CY + h) + ' ' + CX + ' ' + CY,
          'Z'
        ].join(' ');
      }
      case 'arch': {
        var rise = Math.min(120 + c * 1.1, room * 2);
        return 'M 120 ' + (CY + rise / 2) + ' Q ' + CX + ' ' + (CY - rise * 1.5) + ' ' + (VIEW_W - 120) + ' ' + (CY + rise / 2);
      }
      case 'line':
        return 'M -320 ' + CY + ' L ' + (VIEW_W + 320) + ' ' + CY;
      case 'wave':
      default: {
        var a = Math.min(c * 2.2, room * 2);
        return 'M -320 ' + CY + ' Q -160 ' + (CY - a) + ' 0 ' + CY + ' T 320 ' + CY + ' T 640 ' + CY + ' T 960 ' + CY + ' T 1280 ' + CY + ' T 1600 ' + CY + ' T ' + (VIEW_W + 320) + ' ' + CY;
      }
    }
  }

  var base = uppercase ? String(text).toUpperCase() : String(text);
  var gap = separator ? '\u00A0' + separator + '\u00A0' : '\u00A0\u00A0\u00A0';
  var unit = base + gap;
  var d = opts.path || buildPath();
  var pathId = 'text-loop-bg-path';
  var styleAttr = 'font-size:' + fontSize + 'px;font-weight:' + fontWeight + ';letter-spacing:' + letterSpacing + 'px;';

  container.innerHTML =
    '<svg viewBox="0 0 ' + VIEW_W + ' ' + VIEW_H + '" preserveAspectRatio="xMidYMid slice" role="img" aria-label="' + text + '">' +
      '<defs>' +
        '<path id="' + pathId + '" d="' + d + '"/>' +
      '</defs>' +
      '<use href="#' + pathId + '" fill="none" stroke="' + (ribbon ? ribbonColor : 'none') + '" stroke-width="' + (ribbon ? ribbonWidth : 0) + '" stroke-linecap="round" stroke-linejoin="round" class="text-loop-ribbon" />' +
      '<text class="text-loop-measure" style="' + styleAttr + '" aria-hidden="true">' +
        '<textPath href="#' + pathId + '" startOffset="0">' + unit + '</textPath>' +
      '</text>' +
      '<text class="text-loop-text" style="' + styleAttr + '" fill="' + color + '" dominant-baseline="central" aria-hidden="true">' +
        '<textPath data-tl="head" href="#' + pathId + '" startOffset="0">' + unit + '</textPath>' +
      '</text>' +
      '<text class="text-loop-text" style="' + styleAttr + '" fill="' + color + '" dominant-baseline="central" aria-hidden="true">' +
        '<textPath data-tl="tail" href="#' + pathId + '" startOffset="0">' + unit + '</textPath>' +
      '</text>' +
    '</svg>';

  var pathEl = container.querySelector('#' + pathId);
  var measureEl = container.querySelector('.text-loop-measure textPath');
  var head = container.querySelector('textPath[data-tl="head"]');
  var tail = container.querySelector('textPath[data-tl="tail"]');
  if (!pathEl || !measureEl || !head || !tail) return;

  var metrics = { length: 0, reps: 1 };
  function measure() {
    var length = 0, unitWidth = 0;
    try {
      length = pathEl.getTotalLength();
      // 通过 measure text 的 BBox 估单位长度
      var t = container.querySelector('.text-loop-measure');
      if (t) {
        var bbox = t.getBBox();
        unitWidth = bbox.width || 0;
      }
    } catch (e) { return; }
    if (!length) return;
    var reps = unitWidth > 0 ? Math.max(1, Math.round(length / unitWidth)) : 1;
    reps += 1; // 多一份，避免接缝空白
    if (metrics.length !== length || metrics.reps !== reps) {
      metrics.length = length;
      metrics.reps = reps;
      setupLoop();
    }
  }
  function setupLoop() {
    var loopText = '';
    for (var i = 0; i < metrics.reps; i++) loopText += unit;
    head.textContent = loopText;
    tail.textContent = loopText;
    startAnim();
  }

  var tweenRef = null;
  function apply(offset) {
    var partner = offset >= 0 ? offset - metrics.length : offset + metrics.length;
    head.setAttribute('startOffset', String(offset));
    tail.setAttribute('startOffset', String(partner));
  }

  function startAnim() {
    if (!metrics.length) return;
    apply(0);
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced || speed <= 0 || !window.gsap) return;
    if (tweenRef && tweenRef.kill) tweenRef.kill();
    var state = { offset: 0 };
    var target = direction === 'reverse' ? -metrics.length : metrics.length;
    tweenRef = gsap.to(state, {
      offset: target,
      duration: metrics.length / speed,
      ease: 'none',
      repeat: -1,
      onUpdate: function() { apply(state.offset); }
    });
    if (pauseOnHover) {
      container.addEventListener('pointerenter', function() { if (tweenRef) tweenRef.pause(); });
      container.addEventListener('pointerleave', function() { if (tweenRef) tweenRef.resume(); });
    }
  }

  measure();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function() { setTimeout(measure, 30); }).catch(function(){});
  }

  // 监听白天模式切换
  var obs = new MutationObserver(function() {
    if (document.documentElement.classList.contains('light')) {
      if (tweenRef && tweenRef.kill) tweenRef.kill();
      container.style.display = 'none';
    } else {
      container.style.display = '';
      if (!tweenRef) measure();
    }
  });
  obs.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

  return {
    destroy: function() {
      obs.disconnect();
      if (tweenRef && tweenRef.kill) tweenRef.kill();
    }
  };
}

/* ================== Aurora 极光背景 (WebGL2) ================== */
function initAuroraBackground(opts) {
  opts = opts || {};
  var colorStops = opts.colorStops || ['#3A29FF', '#22d3ee', '#a78bfa'];
  var amplitude = opts.amplitude != null ? opts.amplitude : 1.0;
  var blend = opts.blend != null ? opts.blend : 0.5;
  var speed = opts.speed != null ? opts.speed : 1.0;

  var canvas = document.getElementById('auroraBg');
  if (!canvas) return;
  if (document.documentElement.classList.contains('light')) return;

  var gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: true, antialias: true });
  if (!gl) { canvas.style.background = '#09090b'; return; }

  gl.clearColor(0, 0, 0, 0);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

  var VERT = '#version 300 es\nin vec2 position;\nvoid main(){gl_Position=vec4(position,0.0,1.0);}';
  var FRAG = [
    '#version 300 es',
    'precision highp float;',
    'uniform float uTime;uniform float uAmplitude;uniform vec3 uColorStops[3];uniform vec2 uResolution;uniform float uBlend;out vec4 fragColor;',
    'vec3 permute(vec3 x){return mod(((x*34.0)+1.0)*x,289.0);}',
    'float snoise(vec2 v){const vec4 C=vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);vec2 i=floor(v+dot(v,C.yy));vec2 x0=v-i+dot(i,C.xx);vec2 i1=(x0.x>x0.y)?vec2(1.0,0.0):vec2(0.0,1.0);vec4 x12=x0.xyxy+C.xxzz;x12.xy-=i1;i=mod(i,289.0);vec3 p=permute(permute(i.y+vec3(0.0,i1.y,1.0))+i.x+vec3(0.0,i1.x,1.0));vec3 m=max(0.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.0);m=m*m;m=m*m;vec3 x=2.0*fract(p*C.www)-1.0;vec3 h=abs(x)-0.5;vec3 ox=floor(x+0.5);vec3 a0=x-ox;m*=1.79284291400159-0.85373472095314*(a0*a0+h*h);vec3 g;g.x=a0.x*x0.x+h.x*x0.y;g.yz=a0.yz*x12.xz+h.yz*x12.yw;return 130.0*dot(m,g);}',
    'struct ColorStop{vec3 color;float position;};',
    '#define COLOR_RAMP(colors, factor, finalColor) {int index=0;for(int i=0;i<2;i++){ColorStop currentColor=colors[i];bool isInBetween=currentColor.position<=factor;index=int(mix(float(index),float(i),float(isInBetween)));}ColorStop currentColor=colors[index];ColorStop nextColor=colors[index+1];float range=nextColor.position-currentColor.position;float lerpFactor=(factor-currentColor.position)/range;finalColor=mix(currentColor.color,nextColor.color,lerpFactor);}',
    'void main(){vec2 uv=gl_FragCoord.xy/uResolution;ColorStop colors[3];colors[0]=ColorStop(uColorStops[0],0.0);colors[1]=ColorStop(uColorStops[1],0.5);colors[2]=ColorStop(uColorStops[2],1.0);vec3 rampColor;COLOR_RAMP(colors,uv.x,rampColor);float height=snoise(vec2(uv.x*2.0+uTime*0.1,uTime*0.25))*0.5*uAmplitude;height=exp(height);height=(uv.y*2.0-height+0.2);float intensity=0.6*height;float midPoint=0.20;float auroraAlpha=smoothstep(midPoint-uBlend*0.5,midPoint+uBlend*0.5,intensity);vec3 auroraColor=intensity*rampColor;fragColor=vec4(auroraColor*auroraAlpha,auroraAlpha);}'
  ].join('\n');

  function compile(type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error('Aurora shader error:', gl.getShaderInfoLog(sh));
      gl.deleteShader(sh);
      return null;
    }
    return sh;
  }
  var vs = compile(gl.VERTEX_SHADER, VERT);
  var fs = compile(gl.FRAGMENT_SHADER, FRAG);
  if (!vs || !fs) { canvas.style.background = '#09090b'; return; }
  var prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error('Aurora link error:', gl.getProgramInfoLog(prog));
    canvas.style.background = '#09090b';
    return;
  }
  gl.useProgram(prog);

  // 全屏三角形
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var posLoc = gl.getAttribLocation(prog, 'position');
  gl.enableVertexAttribArray(posLoc);
  gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

  function hexToRgb(hex) {
    hex = hex.replace('#', '');
    var r = parseInt(hex.substring(0, 2), 16) / 255;
    var g = parseInt(hex.substring(2, 4), 16) / 255;
    var b = parseInt(hex.substring(4, 6), 16) / 255;
    return [r, g, b];
  }

  var uTime = gl.getUniformLocation(prog, 'uTime');
  var uAmp = gl.getUniformLocation(prog, 'uAmplitude');
  var uColors = gl.getUniformLocation(prog, 'uColorStops');
  var uRes = gl.getUniformLocation(prog, 'uResolution');
  var uBlend = gl.getUniformLocation(prog, 'uBlend');

  var colorsFlat = new Float32Array(9);
  colorStops.forEach(function(c, i) {
    var rgb = hexToRgb(c);
    colorsFlat[i * 3] = rgb[0];
    colorsFlat[i * 3 + 1] = rgb[1];
    colorsFlat[i * 3 + 2] = rgb[2];
  });

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, Math.floor(window.innerWidth * dpr));
    var h = Math.max(1, Math.floor(window.innerHeight * dpr));
    canvas.width = w;
    canvas.height = h;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    gl.viewport(0, 0, w, h);
    gl.uniform2f(uRes, w, h);
  }
  window.addEventListener('resize', resize);
  resize();

  gl.uniform3fv(uColors, colorsFlat);
  gl.uniform1f(uAmp, amplitude);
  gl.uniform1f(uBlend, blend);

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var rafId = 0;
  var startT = performance.now();

  function frame() {
    rafId = requestAnimationFrame(frame);
    var t = (performance.now() - startT) * 0.001;
    gl.uniform1f(uTime, t * speed * 0.1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  if (reduce) {
    gl.uniform1f(uTime, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  } else {
    rafId = requestAnimationFrame(frame);
  }

  // 白天模式切换时清理
  var observer = new MutationObserver(function() {
    if (document.documentElement.classList.contains('light')) {
      cancelAnimationFrame(rafId);
      canvas.style.display = 'none';
    } else {
      canvas.style.display = '';
      if (!reduce && !rafId) rafId = requestAnimationFrame(frame);
    }
  });
  observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

  return {
    destroy: function() {
      cancelAnimationFrame(rafId);
      window.removeEventListener('resize', resize);
      observer.disconnect();
      gl.deleteProgram(prog);
      gl.deleteShader(vs);
      gl.deleteShader(fs);
      gl.deleteBuffer(buf);
    }
  };
}

/* ================== 侧边章节导航 Option Wheel ================== */
function initOptionWheel() {
  const nav = $('#sectionNav');
  if (!nav) return;

  const sections = [
    { id: 'education', label: '教育' },
    { id: 'certificates', label: '证书' },
        { id: 'experience', label: '经历' },
    { id: 'projects', label: '项目' },
    { id: 'skills', label: '技能' },
    { id: 'interests', label: '兴趣' },
  ];

  const root = document.createElement('div');
  root.className = 'option-wheel';
  root.setAttribute('role', 'listbox');
  root.setAttribute('aria-label', '章节导航');
  root.tabIndex = 0;
  nav.appendChild(root);

  const itemEls = [];
  const state = { pos: 0, target: 0, selected: 0, raf: null, last: 0, drag: null, dragMoved: false, wheelTimer: null };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cfg = {
    count: sections.length,
    items: sections,
    curve: 1, tilt: 7, blur: 2, fade: 0.32, minOpacity: 0.04,
    side: 'right', smoothing: reduced ? 1 : 180, rowH: 0, draggable: true
  };

  function measure() {
    const raw = getComputedStyle(root).getPropertyValue('--ow-font-size').trim();
    const num = parseFloat(raw);
    const unit = raw.match(/(rem|em|px)$/);
    const remPx = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
    const fs = (unit && unit[1] === 'px') ? num : num * remPx;
    cfg.rowH = Math.max(fs * 1.55, 1);
  }

  // 单一 rAF 循环：指数平滑逼近目标位置，再沿弧线排布每个选项
  function runFrame(now) {
    const dt = Math.min((now - state.last) / 1000, 0.05);
    state.last = now;
    const tau = Math.max(cfg.smoothing, 1) / 1000;
    const k = 1 - Math.exp(-dt / tau);
    const target = state.target;
    let next = state.pos + (target - state.pos) * k;
    const settled = Math.abs(target - next) < 0.001;
    if (settled) next = target;
    state.pos = next;

    // 选项落在半径 R 的圆弧上（弧长 = 行高），tilt 控制卷曲程度
    const tiltRad = (cfg.tilt * Math.PI) / 180;
    const R = tiltRad > 0.0005 ? cfg.rowH / tiltRad : 0;
    const mirror = cfg.side === 'right' ? -1 : 1;

    for (let i = 0; i < cfg.count; i++) {
      const el = itemEls[i];
      if (!el) continue;
      const d = i - next;
      const dist = Math.abs(d);
      let x = 0, y = d * cfg.rowH, rot = 0;
      if (R > 0) {
        const ang = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, d * tiltRad));
        y = R * Math.sin(ang);
        x = -mirror * R * (1 - Math.cos(ang)) * cfg.curve;
        rot = (mirror * ang * 180) / Math.PI;
      }
      el.style.transform = `translate(${x.toFixed(2)}px, calc(${y.toFixed(2)}px - 50%)) rotate(${rot.toFixed(3)}deg)`;
      el.style.opacity = String(Math.max(cfg.minOpacity, 1 - dist * cfg.fade));
      el.style.filter = cfg.blur > 0 ? `blur(${(dist * cfg.blur).toFixed(2)}px)` : 'none';
      el.style.setProperty('--ow-p', Math.max(0, 1 - Math.min(dist, 1)).toFixed(4));
      el.classList.toggle('option-wheel__item--selected', i === state.selected);
      el.setAttribute('aria-selected', i === state.selected);
    }
    state.raf = settled ? null : requestAnimationFrame(runFrame);
  }

  function startLoop() {
    if (state.raf != null) cancelAnimationFrame(state.raf);
    state.last = performance.now();
    state.raf = requestAnimationFrame(runFrame);
  }

  // silent=true 时仅更新选中态，不触发滚动（供滚动监听回写，避免死循环）
  function applyTarget(value, snap, silent) {
    let v = Math.min(Math.max(value, 0), Math.max(cfg.count - 1, 0));
    if (snap) v = Math.round(v);
    state.target = v;
    const idx = Math.round(v);
    if (idx !== state.selected) {
      state.selected = idx;
      if (!silent) {
        const el = document.getElementById(cfg.items[idx].id);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }
    startLoop();
  }

  sections.forEach((s, i) => {
    const item = document.createElement('div');
    item.className = 'option-wheel__item';
    item.setAttribute('role', 'option');
    item.textContent = s.label;
    item.addEventListener('click', () => {
      if (state.dragMoved) return; // 拖拽后的 click 不触发跳转
      applyTarget(i, true, false);
    });
    root.appendChild(item);
    itemEls.push(item);
  });

  // 滚轮：每格滚一个选项，触控板连续滚动
  root.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaMode === 1 ? e.deltaY * 24 : e.deltaY;
    const step = Math.max(-1, Math.min(1, delta / cfg.rowH));
    applyTarget(state.target + step, false, false);
    clearTimeout(state.wheelTimer);
    state.wheelTimer = setTimeout(() => applyTarget(state.target, true, false), 140);
  }, { passive: false });

  // 拖拽：超过 4px 才算真拖拽并捕获指针，纯点击仍能落到选项上
  root.addEventListener('pointerdown', (e) => {
    if (!cfg.draggable) return;
    state.drag = { y: e.clientY, start: state.target, id: e.pointerId };
    state.dragMoved = false;
    root.classList.add('option-wheel--dragging');
  });
  root.addEventListener('pointermove', (e) => {
    const drag = state.drag;
    if (!drag) return;
    const dy = e.clientY - drag.y;
    if (!state.dragMoved && Math.abs(dy) > 4) {
      state.dragMoved = true;
      try { root.setPointerCapture(drag.id); } catch (err) {}
    }
    if (state.dragMoved) applyTarget(drag.start - dy / cfg.rowH, false, false);
  });
  function endDrag() {
    if (!state.drag) return;
    state.drag = null;
    root.classList.remove('option-wheel--dragging');
    if (state.dragMoved) applyTarget(state.target, true, false);
    setTimeout(() => { state.dragMoved = false; }, 0); // 等本次 click 结束后再复位
  }
  root.addEventListener('pointerup', endDrag);
  root.addEventListener('pointercancel', endDrag);

  // 键盘：方向键上下切换
  root.addEventListener('keydown', (e) => {
    let delta = null;
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') delta = -1;
    else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') delta = 1;
    if (delta == null) return;
    e.preventDefault();
    applyTarget(Math.round(state.target) + delta, true, false);
  });

  // 滚动监听：当前章节回写选中项（静默，不反向滚动）
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const idx = sections.findIndex(s => s.id === entry.target.id);
        if (idx >= 0 && idx !== state.selected) applyTarget(idx, true, true);
      }
    });
  }, { rootMargin: '-40% 0px -55% 0px', threshold: 0 });
  sections.forEach(s => {
    const el = document.getElementById(s.id);
    if (el) io.observe(el);
  });

  // 字号可能随断点变化，resize 时重新测量
  window.addEventListener('resize', () => {
    measure();
    applyTarget(state.target, false, true);
  });

  measure();
  applyTarget(0, true, true);
}

/* ================== Hero 视差光晕 ================== */
function initParallaxGlow() {
  const header = document.querySelector('header.parallax-glow');
  if (!header) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (matchMedia('(hover: none)').matches) return;

  let ticking = false;
  header.addEventListener('mousemove', (e) => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const rect = header.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      header.style.setProperty('--glow-x', `${x}%`);
      header.style.setProperty('--glow-y', `${y}%`);
      ticking = false;
    });
  });

  header.addEventListener('mouseleave', () => {
    header.style.setProperty('--glow-x', '50%');
    header.style.setProperty('--glow-y', '50%');
  });
}
